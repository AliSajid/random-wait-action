---
on:
    pull_request:
        types: [closed]
        branches:
            - main
            - next

    workflow_dispatch:
        inputs:
            release_branch:
                description: >
                    Branch to run the release workflow against. Only main and next can
                    publish; every other branch is forced to dry-run.
                required: true
                default: 'main'
                type: string
            dry_run:
                description: 'Prepare the release but do not create commits, tags, or GitHub releases'
                required: true
                default: false
                type: boolean

name: Release

permissions: {}

concurrency:
    group: >
        release-${{ github.event_name == 'workflow_dispatch' &&
        inputs.release_branch ||
        github.event.pull_request.base.ref }}
    cancel-in-progress: false

jobs:
    validate-pr-author:
        name: Validate PR Author
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
        permissions:
            contents: read
            pull-requests: read
        outputs:
            is_valid: ${{ steps.validate.outputs.is_valid }}
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
              with:
                  version: 2026.6.14
                  install_args: --yes

            - name: Check PR author
              id: validate
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  AUTHOR: ${{ github.event.pull_request.user.login }}
                  AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: mise run release:validate-author

    release:
        name: Cocogitto Release
        runs-on: ubuntu-latest
        needs: validate-pr-author
        timeout-minutes: 20

        if: >
            always() &&
            (
                (
                    github.event_name == 'pull_request_target' &&
                    github.event.pull_request.merged == true &&
                    !contains(github.event.pull_request.title, '[skip ci]') &&
                    needs.validate-pr-author.outputs.is_valid == 'true'
                ) ||
                github.event_name == 'workflow_dispatch'
            )

        permissions:
            contents: write

        outputs:
            version: ${{ steps.check_changes.outputs.expected }}
            has_changes: ${{ steps.check_changes.outputs.has_changes }}
            branch: ${{ steps.branch.outputs.branch }}
            pre_release: ${{ steps.release_type.outputs.pre_release }}

        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  disable-sudo: true
                  egress-policy: block
                  disable-core-dump: true
                  allowed-endpoints: >
                      api.github.com:443
                      github.com:443
                      objects.githubusercontent.com:443
                      registry.npmjs.org:443
                      mise.jdx.dev:443
                      uploads.github.com:443

            - name: Checkout repository (shallow)
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
              with:
                  version: 2026.6.14
                  install_args: --yes

            - name: Determine target branch
              id: branch
              run: mise run release:determine-branch
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  INPUTS_RELEASE_BRANCH: ${{ inputs.release_branch }}
                  GITHUB_EVENT_PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref }}

            - name: Determine release type
              id: release_type
              run: mise run release:determine-release-type
              env:
                  BRANCH: ${{ steps.branch.outputs.branch }}

            - name: Determine run mode
              id: mode
              run: mise run release:determine-mode
              env:
                  BRANCH: ${{ steps.branch.outputs.branch }}
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  INPUTS_DRY_RUN: ${{ inputs.dry_run }}

            - name: Create GitHub App token
              id: app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ steps.branch.outputs.branch }}
                  token: ${{ steps.app_token.outputs.token }}

            - name: Install mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
              with:
                  version: 2026.6.14
                  install_args: --yes

            - name: Build and verify
              run: mise run ci

            - name: Check for releasable changes
              id: check_changes
              run: mise run release:check-changes
              env:
                  PRE_RELEASE: ${{ steps.release_type.outputs.pre_release }}

            - name: Prepare release files
              if: steps.check_changes.outputs.has_changes == 'true'
              id: prepare
              run: mise run release:prepare
              env:
                  VERSION: ${{ steps.check_changes.outputs.expected }}
                  PRE_RELEASE: ${{ steps.release_type.outputs.pre_release }}
                  RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}

            - name: Validate release file changes
              if: steps.check_changes.outputs.has_changes == 'true' && steps.prepare.outputs.has_file_changes == 'true'
              run: mise run release:validate-files

            - name: Show dry-run release changes
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'true'
              run: mise run release:dry-run
              env:
                  RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
                  PRE_RELEASE: ${{ steps.release_type.outputs.pre_release }}
                  VERSION: ${{ steps.check_changes.outputs.expected }}

            - name: Verify exact release tag does not exist remotely
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              run: mise run release:verify-tag
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  VERSION: ${{ steps.check_changes.outputs.expected }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - name: Create verified release commit
              if: steps.check_changes.outputs.has_changes == 'true' &&
                  steps.prepare.outputs.has_file_changes == 'true' &&
                  steps.mode.outputs.dry_run == 'false'
              id: release_commit
              run: mise run release:create-release-commit
              env:
                  RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
                  VERSION: ${{ steps.check_changes.outputs.expected }}
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - name: Determine release target commit
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              id: release_target
              run: mise run release:determine-target
              env:
                  RELEASE_STATE_FILE: /tmp/release-state.env

            - name: Verify release target commit exists
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              run: mise run release:verify-target
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  RELEASE_STATE_FILE: /tmp/release-state.env
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - name: Refresh checkout to release commit
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              run: mise run release:refresh-checkout
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
                  RELEASE_STATE_FILE: /tmp/release-state.env

            - name: Create local semver tags
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              id: tags
              run: mise run release:create-tags
              env:
                  VERSION: ${{ steps.check_changes.outputs.expected }}
                  RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
                  PRE_RELEASE: ${{ steps.release_type.outputs.pre_release }}

            - name: Push semver tags
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              run: mise run release:push-tags
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  RELEASE_STATE_FILE: /tmp/release-state.env
                  GITHUB_REPOSITORY: ${{ github.repository }}

            - name: Create GitHub Release
              if: steps.check_changes.outputs.has_changes == 'true' && steps.mode.outputs.dry_run == 'false'
              run: mise run release:create-release
              env:
                  GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
                  VERSION: ${{ steps.check_changes.outputs.expected }}
                  PRE_RELEASE: ${{ steps.release_type.outputs.pre_release }}
