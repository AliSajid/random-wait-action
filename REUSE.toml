# ---------------------------------------------------------------------------
# MIT — Core project code, configs, and metadata
# ---------------------------------------------------------------------------
[[annotations]]
path = [
    "**.json",
    ".github/workflows/**.yaml",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "mise.lock",
    "package.json",
    "pnpm-lock.yaml",
    "renovate.json",
    "tsconfig.json",
    "website/package.json",
    "website/pnpm-lock.yaml",
    "website/pnpm-workspace.yaml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Ali Sajid Imami <Ali.Sajid.Imami@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["dist/**", "lib/**", "website/dist/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Ali Sajid Imami <Ali.Sajid.Imami@gmail.com>"
SPDX-License-Identifier = "MIT"

# ---------------------------------------------------------------------------
# CC-BY-NC-SA-4.0 — Guide content
# ---------------------------------------------------------------------------
[[annotations]]
path = ["website/src/**/*.md", "website/src/**/*.astro", "website/src/**/*.mdx"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Ali Sajid Imami <Ali.Sajid.Imami@gmail.com>"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# ---------------------------------------------------------------------------
# CC0-1.0 — Tooling, meta, and repo hygiene
# ---------------------------------------------------------------------------
[[annotations]]
