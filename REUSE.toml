    ".codacy.yaml",
    ".editorconfig",
    ".eslintignore",
    ".gitattributes",
    ".gitignore",
    ".markdownlintignore",
    ".pinact.yaml",
    ".prettierignore",
    ".secrets.baseline",
    ".vale.ini",
    ".yamllint.yaml",
    "CODEOWNERS",
    "REUSE.toml",
    "sonar-project.properties",
    "styles/**/*.txt",
    "website/.gitignore",
    "website/public/robots.txt",
]
