---
name: 'Random Wait Action'
description: 'Add configurable jitter to stagger parallel GitHub Actions jobs'
author: 'Ali Sajid Imami'
inputs:
    minimum:
        required: false
        description: 'Minimum wait time in seconds'
        default: '1'
    maximum:
        required: false
        description: 'Maximum wait time in seconds'
        default: '10'
outputs:
    wait_time:
        description: 'The time waited in seconds'
runs:
    using: 'node24'
    main: 'dist/index.cjs'
branding:
    icon: 'clock'
    color: 'blue'
