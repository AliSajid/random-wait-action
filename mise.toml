# Reproducible development toolchain for Random Wait Action.
# JavaScript dependencies remain in package.json and are installed with pnpm.

[tools]
# Match the runtime declared by the v3 JavaScript action.
node = "24.16.0"
pnpm = "11.15.1"

# Python tools (for pre-commit hooks)
python = "3.14.6"
pre-commit = "4.6.0"

# Git tooling (non-npm)
hk = "1.50.0"
pkl = "0.31.1"
"pipx:texthooks" = "0.7.1"
cocogitto = "7.0.0"
"pipx:reuse" = "6.2.0"
"npm:renovate" = "43.249.5"
gitleaks = "8.30.1"
editorconfig-checker = "3.8.0"

# GitHub Actions correctness, policy, pinning, and security analysis.
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.0"
"pipx:zizmor" = "1.28.0"

# Structured configuration, shell, and prose tooling used by hk.pkl.
taplo = "0.10.0"
yamllint = "1.38.0"
vale = "3.15.1"
zizmor = "1.28.0"

# Tasks live in .mise/tasks/ so they remain executable, testable scripts.
# Run `mise tasks ls` to inspect them.
